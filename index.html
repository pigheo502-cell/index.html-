<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Solutions Pre-Intermediate 3rd - Đọc & Dịch Tức Thì</title>
  
  <!-- PDF.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
  
  <!-- PageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #2c3e50;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Thanh điều khiển trên cùng */
    #toolbar {
      height: 50px;
      background: #1a252f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    #toolbar button {
      background: #3498db;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    #toolbar button:disabled { background: #7f8c8d; }
    #page-info { font-size: 14px; }

    /* Khung chứa sách */
    #book-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .page-wrapper {
      position: relative;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* Lớp chọn văn bản (Text Layer) */
    .textLayer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      opacity: 0.25;
      line-height: 1.0;
    }

    /* Popup Dịch (Tooltip) */
    #translate-popup {
      position: absolute;
      display: none;
      background: #ffffff;
      color: #333;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 1000;
      max-width: 280px;
      font-size: 14px;
      border: 1px solid #ddd;
      animation: fadeIn 0.2s ease-in-out;
    }
    #translate-popup .original { font-weight: bold; color: #2c3e50; margin-bottom: 4px; border-bottom: 1px solid #eee; padding-bottom: 4px;}
    #translate-popup .translated { color: #27ae60; font-weight: 600; }
    #translate-popup .loading { color: #888; font-style: italic; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Thanh điều khiển -->
  <div id="toolbar">
    <button id="prev-btn">◀ Trang trước</button>
    <span id="page-info">Trang <span id="current-page">1</span> / <span id="total-pages">--</span></span>
    <button id="next-btn">Trang sau ▶</button>
  </div>

  <!-- Khung hiển thị Flipbook -->
  <div id="book-container">
    <div id="flipbook"></div>
  </div>

  <!-- Popup hiển thị bản dịch -->
  <div id="translate-popup">
    <div class="original" id="pop-orig">...</div>
    <div class="translated" id="pop-trans">Đang dịch...</div>
  </div>

  <script>
    // Link file PDF sách Solutions Pre-Intermediate 3rd Edition
    const pdfUrl = 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/examples/learning/helloworld.pdf'; // Thay bằng đường link file PDF trực tiếp của bạn
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pageFlip = null;
    let pdfDoc = null;
    const popup = document.getElementById('translate-popup');

    // Khởi tạo Flipbook
    async function init() {
      try {
        pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        document.getElementById('total-pages').textContent = pdfDoc.numPages;

        pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
          width: 450,
          height: 600,
          size: "stretch",
          minWidth: 315,
          maxWidth: 1000,
          minHeight: 420,
          maxHeight: 1350,
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: false
        });

        // Tạo khung trang
        const pagesContainer = document.getElementById('flipbook');
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-wrapper';
          pageDiv.dataset.page = i;
          
          const canvas = document.createElement('canvas');
          const textLayerDiv = document.createElement('div');
          textLayerDiv.className = 'textLayer';
          
          pageDiv.appendChild(canvas);
          pageDiv.appendChild(textLayerDiv);
          pagesContainer.appendChild(pageDiv);
        }

        pageFlip.loadFromHTML(document.querySelectorAll('.page-wrapper'));

        // Render trang đầu tiên
        renderPage(1);
        renderPage(2);

        pageFlip.on('flip', (e) => {
          const pageNum = e.data + 1;
          document.getElementById('current-page').textContent = pageNum;
          renderPage(pageNum);
          renderPage(pageNum + 1);
          hidePopup();
        });

      } catch (err) {
        console.error("Lỗi tải PDF:", err);
      }
    }

    // Vẽ trang PDF & trích xuất lớp chữ (Text Layer)
    async function renderPage(pageNum) {
      if (pageNum > pdfDoc.numPages) return;
      
      const pageWrapper = document.querySelectorAll('.page-wrapper')[pageNum - 1];
      if (pageWrapper.dataset.rendered) return;

      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });

      const canvas = pageWrapper.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      // Render Text Layer để bôi đen tra từ
      const textContent = await page.getTextContent();
      const textLayerDiv = pageWrapper.querySelector('.textLayer');
      textLayerDiv.style.width = canvas.style.width;
      textLayerDiv.style.height = canvas.style.height;

      pdfjsLib.renderTextLayer({
        textContent: textContent,
        container: textLayerDiv,
        viewport: viewport,
        textDivs: []
      });

      pageWrapper.dataset.rendered = "true";
    }

    // Nút điều khiển lật trang
    document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
    document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());

    // Xử lý sự kiện Chọn/Bôi đen văn bản để Dịch
    document.addEventListener('touchend', handleSelection);
    document.addEventListener('mouseup', handleSelection);

    function handleSelection(e) {
      setTimeout(() => {
        const selection = window.getSelection();
        const selectedText = selection.toString().trim();

        if (selectedText.length > 0) {
          const range = selection.getRangeAt(0);
          const rect = range.getBoundingClientRect();

          // Định vị vị trí hiện Popup ngay trên từ được chọn
          popup.style.top = `${rect.top + window.scrollY - 60}px`;
          popup.style.left = `${Math.max(10, rect.left + (rect.width / 2) - 100)}px`;
          
          document.getElementById('pop-orig').textContent = selectedText;
          document.getElementById('pop-trans').textContent = "Đang dịch...";
          document.getElementById('pop-trans').className = "loading";
          popup.style.display = 'block';

          translateText(selectedText);
        } else {
          hidePopup();
        }
      }, 200);
    }

    function hidePopup() {
      popup.style.display = 'none';
    }

    // Gọi API dịch tự động (Google Translate API)
    async function translateText(text) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        let translatedStr = "";
        data[0].forEach(item => { if (item[0]) translatedStr += item[0]; });

        document.getElementById('pop-trans').textContent = translatedStr;
        document.getElementById('pop-trans').className = "translated";
      } catch (err) {
        document.getElementById('pop-trans').textContent = "Lỗi dịch thuật!";
      }
    }

    init();
  </script>
</body>
</html>
